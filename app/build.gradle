plugins { id 'com.android.application' }

android {
    namespace 'com.kozzzak.simplefirewall'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kozzzak.simplefirewall'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Stable release key: supplied only by CI secrets (or a local env), never committed.
    def releaseKeystore = System.getenv('SF_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('SF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SF_KEY_ALIAS')
                keyPassword System.getenv('SF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            debuggable false
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
