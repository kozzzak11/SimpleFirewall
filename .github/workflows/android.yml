name: Build and test APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local network probe
        run: |
          mkdir -p /tmp/sf-probe
          python3 -c "from pathlib import Path; Path('/tmp/sf-probe/probe.txt').write_bytes(b'sf-ok' + b'x' * 262144)"
          python3 -m http.server 8787 --bind 0.0.0.0 --directory /tmp/sf-probe > /tmp/sf-probe.log 2>&1 &
      - name: Verify firewall on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r probe/build/outputs/apk/debug/probe-debug.apk
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.kozzzak.simplefirewall/.MainActivity
            sleep 2
            mkdir -p app/build/ui
            python3 ci/capture-ui.py
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SimpleFirewall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleFirewall-debug-APK
          path: SimpleFirewall.apk
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/ui/

  # Signed, non-debuggable release. Runs only for version tags, after the
  # emulator verification passed. Existing releases are never overwritten.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check tag matches versionName
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # The release key lives only in repository secrets.
      - name: Signing key
        env:
          SF_KEYSTORE_BASE64: ${{ secrets.SF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SF_KEYSTORE_BASE64" ]; then echo "::error::SF_KEYSTORE_BASE64 secret missing"; exit 1; fi
          umask 077
          printf '%s' "$SF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "SF_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          SF_KEYSTORE_PASSWORD: ${{ secrets.SF_KEYSTORE_PASSWORD }}
          SF_KEY_ALIAS: ${{ secrets.SF_KEY_ALIAS }}
          SF_KEY_PASSWORD: ${{ secrets.SF_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Verify signature and build type
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          # Updates must install over existing installs: the certificate has to stay the same.
          EXPECTED=a2127a4d29057febefbbd27c6aa6fbd571e67205fda5d147769e140c0c19803c
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "::error::Unexpected signing certificate $ACTUAL"; exit 1; fi
          if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then echo "::error::Release APK is debuggable"; exit 1; fi
          cp "$APK" SimpleFirewall.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to overwrite. Bump the version."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" SimpleFirewall.apk --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SimpleFirewall $VERSION" --latest \
            --notes "Signed release APK (stable key). Optional ad blocking is off by default and filters DNS inside the same local VPN. Verified on Android 15 emulator in GitHub Actions."
